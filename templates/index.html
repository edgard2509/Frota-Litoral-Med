  <main>
    <section><h2>Veículos</h2><p>Em breve: cadastro e consulta de veículos.</p></section>
    <section><h2>Movimentações</h2><p>Em breve: registro de saídas e retornos.</p></section>
    <section><h2>Manutenções</h2><p>Em breve: controle de manutenções preventivas e corretivas.</p></section>

</html>
